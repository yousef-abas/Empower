/* ---------- premium polish ---------- */
@keyframes cfFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cfPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes cfRing{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes cfPulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 5px transparent}100%{box-shadow:0 0 0 0 transparent}}
#view{animation:cfFade .45s cubic-bezier(.22,.61,.36,1)}
.mcard{animation:cfPop .5s both;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.mcard:nth-child(2){animation-delay:.06s}.mcard:nth-child(3){animation-delay:.12s}.mcard:nth-child(4){animation-delay:.18s}
.mcard:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(15,111,122,.16);border-color:var(--pri)}
.hero{transition:box-shadow .3s}.hero:hover{box-shadow:0 14px 36px rgba(28,76,89,.12)}

tbody tr{animation:cfFade .3s both}

/* ---------- visual identity ---------- */
:root{--grad:linear-gradient(135deg,#0f6f7a 0%,#12a4b3 55%,#4cc3cf 100%)}
/* glassmorphism hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(244,251,251,.9),rgba(255,255,255,.7));backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.6);box-shadow:0 8px 30px rgba(28,76,89,.10)}
.hero::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-90px;top:-120px;background:var(--grad);opacity:.14;filter:blur(30px);pointer-events:none}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;left:-60px;bottom:-90px;background:radial-gradient(circle,#4cc3cf,transparent 70%);opacity:.16;filter:blur(20px);pointer-events:none}

.mcard{background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--card) 92%,var(--pri)));backdrop-filter:blur(4px)}
.mcard b{font-size:40px!important;letter-spacing:-.5px;font-weight:800;line-height:1.1;margin-top:6px}
.mcard span{font-size:15px!important;font-weight:600;color:var(--ink)}
.mcard i{font-size:13px!important;margin-top:4px}
.mcard{padding:20px 20px}
.mcard .kpival{font-size:inherit}

#exp,#pend,#norev{border-color:var(--pri);color:var(--pri)}
nav a.on{background:linear-gradient(90deg,rgba(76,195,207,.22),transparent);box-shadow:inset 3px 0 var(--hi)}
.hero h2 em,.logo em{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* gradient chart bars */
.hb i::after{background:var(--grad)!important;box-shadow:0 1px 4px rgba(15,111,122,.25)}
.stk i{background:var(--grad)!important}
.cols rect,.donut circle{filter:drop-shadow(0 1px 2px rgba(0,0,0,.12))}

select[data-f=st]{border:1px solid transparent!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}

select[data-f=st][data-v="To Do"]{background:linear-gradient(90deg,#fff4df,#fdedcf)!important}
select[data-f=st][data-v^="Pending"]{background:linear-gradient(90deg,#eaf0ff,#e0e9ff)!important}

<script>
const BASE=[];
const STS=['To Do','Pending FC','Pending Paragon','Pending Approval','Doubt','Done'];
const DEFS=['No Defect','No Inventory','Inconclusive','Inaccurate PDP','WIS','CF','VM','VMM','GSAB','Duplicate','Expired Use Period'];
const NON_DEFECT=['No Defect','No Inventory','Inconclusive']; // outcomes NOT counted as a confirmed defect
const EDIT=['inv','st','df','idt','fc','ad','rv','nt','cid','pl'],STATIC=['wk','cd','asin','mcid','pvs','sim'],PS=50;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'<','>':'>','"':'"'}[c]));
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return ''}};
/* ---- standalone persistence (used when cloud db is unavailable) ---- */
const LS_OV='caseflow_ov',LS_LOG='caseflow_log';
function loadLocal(){try{ov=JSON.parse(ls(LS_OV)||'{}')||{}}catch(e){ov={}}try{log=JSON.parse(ls(LS_LOG)||'[]')||[]}catch(e){log=[]}}
function saveLocal(){if(db)return;try{ls(LS_OV,JSON.stringify(ov))}catch(e){}try{ls(LS_LOG,JSON.stringify(log.slice(0,200)))}catch(e){}}
const pick=(o,ks)=>{const r={};ks.forEach(k=>{if(k in o)r[k]=o[k]});return r};
const pct=(a,b)=>b?Math.round(a/b*100):0,today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let db=null,dl=null,ov={},log=[],rows=[],me=ls('me')||'',tab='q',F=loadF(),A={wk:''};
function loadF(){const d={q:'',wk:'',inv:ls('me')?'mine':'all',st:'open',fc:'',ad:'',dfrom:'',dto:'',pg:0};try{const s=JSON.parse(ls('caseflow_F')||'{}');return{...d,...s,pg:0}}catch(e){return d}}
function saveF(){try{ls('caseflow_F',JSON.stringify({q:F.q,wk:F.wk,inv:F.inv,st:F.st,fc:F.fc,ad:F.ad,dfrom:F.dfrom,dto:F.dto}))}catch(e){}}
const SLA=7;                 /* days-open threshold for "overdue" */
let bulkSel=new Set();       /* selected case ids for bulk actions */
const COLS=['mcid','idt','nt'];  /* user-toggleable secondary columns */
const AUTOCOLS=['days','fc','ad'];     /* hidden by default, shown only when filtered */
function loadCols(){try{return JSON.parse(ls('caseflow_cols')||'{}')||{}}catch(e){return{}}}
function applyCols(){const h=loadCols(),t=$('#tbl');if(!t)return;
  COLS.forEach(c=>t.classList.toggle('h-'+c,h[c]===true));
  t.classList.toggle('h-days',!F.od);           /* Days open shows when "overdue" filter on */
  t.classList.toggle('h-fc',!F.fc);             /* FC shows when an FC is selected */
  t.classList.toggle('h-ad',!F.ad);             /* Type shows when a type is selected */
  document.querySelectorAll('#colpop input[data-col]').forEach(cb=>{cb.checked=!(h[cb.dataset.col]===true)})}
const cl=s=>String(s??'').trim(),L0=s=>cl(s).toLowerCase();
const N={ // normalisation is used ONLY for grouping/filters/analytics; the table always shows the raw sheet value
 inv:v=>{const k=L0(v);return k==='0'?'':({'mohamed':'Mohamed','mohamed/hayam':'Mohamed/Hayam','other investigator':'Other'}[k]||cl(v))},
 st:v=>({'done':'Done','pending approval':'Pending Approval','pending fc':'Pending FC','pending paragon':'Pending Paragon','doubt':'Doubt','doupt':'Doubt'}[L0(v)]||'To Do'),
 df:v=>{const k=L0(v);return DEFS.find(d=>d.toLowerCase()===k)||(k==='0'||k.includes('http')?'':cl(v))},
 ad:v=>L0(v)==='adhoc'?'Adhoc':'CCR',
 rv:v=>{const k=L0(v);return k.startsWith('not reversed')?'Not Reversed':k==='reversed'?'Reversed':''}
};
function mk(id,b,o){
  const raw={inv:'',st:'',df:'',idt:'',fc:'',ad:'',rv:'',cid:'',nt:'',...pick(b,EDIT),...(o?pick(o,EDIT):{})};
  return{id,imp:b.imp,wk:b.wk,cd:b.cd,asin:b.asin,mcid:b.mcid,pvs:b.pvs,sim:b.sim,pl:raw.pl||'',raw,cid:raw.cid,idt:raw.idt,fc:raw.fc,nt:raw.nt,inv:N.inv(raw.inv),st:N.st(raw.st),df:N.df(raw.df),ad:N.ad(raw.ad),rv:N.rv(raw.rv)};
}
function build(){
  const m=BASE.map(b=>mk(b.id,b,ov[b.id]));
  Object.keys(ov).filter(k=>ov[k].imp).forEach(k=>m.push(mk(k,{...pick(ov[k],STATIC),imp:1},ov[k])));
  rows=m;
}
const eq=r=>me&&(r.inv||'').toLowerCase().split('/').includes(me.toLowerCase());
const names=()=>[...new Set(rows.map(r=>r.inv).filter(n=>n&&!n.includes('/')))].sort();
function toast(t,kind){const e=$('#toast');const ic=kind==='warn'?'⚠️':kind==='ok'?'✓':'•';e.innerHTML='<span>'+ic+'</span><span>'+String(t).replace(/</g,'&lt;')+'</span>';e.className='on'+(kind?(' '+kind):'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2600)}
function setSync(ok){const s=$('#sync');s.className='pill '+(ok?'ok':'no');s.textContent=ok?'Live · shared':'Saved on this device'}
/* ---------- saving ---------- */
function save(r,patch){
  const ch=Object.entries(patch).filter(([k,v])=>(r.raw[k]||'')!==(v||''));if(!ch.length)return;
  const now=new Date().toISOString(),lg=ch.map(([k,v])=>({at:now,by:me,id:r.id,asin:r.asin,wk:r.wk,f:k,o:r.raw[k]||'',n:v||''}));
  Object.assign(r.raw,patch);

const overdue=r=>{const a=age(r);return a!==''&&a>SLA};
function saveMany(ids,patch){
  const now=new Date().toISOString();let n=0;

const UR=/https?:\/\/[^\s)\]]+/,C_URL='https://paragon-eu.amazon.com/hz/view-investigation?caseId=';
let U=null;
const p2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const rw=x=>{if(x==null)return '';if(x instanceof Date){const d=ymd(x);return x.getHours()||x.getMinutes()?d+' '+p2(x.getHours())+':'+p2(x.getMinutes()):d}return String(x).trim()};

function parseSheet(buf){
  const wb=XLSX.read(buf,{cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]],rg=XLSX.utils.decode_range(ws['!ref']||'A1');
  const A=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}),H=(A[0]||[]).map(h=>String(h).trim().toLowerCase());
  const col=(...n)=>H.findIndex(h=>n.includes(h));
  const K={wk:col('wk','creation wk','week'),cd:col('creation date'),asin:col('asin'),mcid:col('mcid'),pvs:col('pvs'),sim:col('sim'),pl:col('paragon case link'),cid:col('paragon case id'),inv:col('investigator'),st:col('statues','status'),df:col('defect type'),idt:col('investigation date'),fc:col('fc'),ad:col('adhoc (y/n)','adhoc'),rv:col('reversed')};
  if(K.asin<0)throw new Error('no ASIN column');
  const v=(i,c)=>c<0?'':rw(A[i][c]);
  const link=(i,c)=>{if(c<0)return '';const m=v(i,c).match(UR);if(m)return m[0];const cell=ws[XLSX.utils.encode_cell({r:rg.s.r+i,c:rg.s.c+c})];return(cell&&cell.l&&cell.l.Target)||''};
  const docs=[];let skipped=0;
  for(let i=1;i<A.length;i++){
    const asin=v(i,K.asin);if(!asin){if(A[i].some(x=>x!==''))skipped++;continue}
    const cd=v(i,K.cd),pl=link(i,K.pl),cd0=cdate(cd);
    docs.push({imp:1,wk:+v(i,K.wk)||(cd0?isoWeek(ymd(cd0)):''),cd,asin,mcid:v(i,K.mcid),pvs:link(i,K.pvs),sim:link(i,K.sim),pl,
      cid:v(i,K.cid)||((pl.match(/caseId=(\d+)/)||[])[1]||''),inv:v(i,K.inv),st:v(i,K.st),df:v(i,K.df),idt:v(i,K.idt),fc:v(i,K.fc),ad:v(i,K.ad),rv:v(i,K.rv),nt:''});
  }
  return{docs,skipped};
}
async function readFile(f){
  if(!f)return;
  try{
    const{docs,skipped}=parseSheet(await f.arrayBuffer()),seen=new Set(rows.map(r=>[r.asin,r.mcid,r.wk].join('|')));let dup=0;const fresh=[];
    docs.forEach(d=>{const k=[d.asin,d.mcid,d.wk].join('|');if(seen.has(k)){dup++;return}seen.add(k);fresh.push(d)});
    U={name:f.name,fresh,dup,skipped};renderU();
  }catch(e){toast('Could not read the file — it needs an ASIN column')}
}
async function confirmImport(){

  toast('Uploading '+n+' tickets…');

  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'No update');await save2(wb,`SIMs_no_update_${today()}.xlsx`);
}
const noReversal=()=>rows.filter(r=>r.rv!=='Reversed').sort((a,b)=>(a.wk||0)-(b.wk||0));
async function exportNoReversal(){
  const P=noReversal();if(!P.length)return toast('Every case is already Reversed','warn');
  const ws=XLSX.utils.aoa_to_sheet([['ASIN','MCID'],...P.map(r=>[r.asin,r.mcid])]);
  ws['!cols']=[{wch:16},{wch:18}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Not reversed');await save2(wb,`ASIN_MCID_not_reversed_${today()}.xlsx`);
}
function renderU(){
  const P=pending(),bw=grp(P.filter(r=>r.wk),r=>r.wk).sort((a,b)=>a[0]-b[0]).map(([k,v])=>['WK'+k,v.length]);
  const imps=log.filter(x=>x.f==='import').slice(0,8),f=t=>new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const ch=(u,t)=>u?`<a class="chip" target="_blank" rel="noopener" href="${esc(u)}">${t}</a>`:'';
  const box=U?`<p style="margin-top:0"><b>${esc(U.name)}</b><br>${U.fresh.length} new tickets to add · ${U.dup} already in the tracker (skipped)${U.skipped?` · ${U.skipped} rows without an ASIN ignored`:''}</p>
    ${U.fresh.length?`<table class="prev"><tr><th>Week</th><th>ASIN</th><th>MCID</th><th>Links</th></tr>${U.fresh.slice(0,6).map(d=>`<tr><td>${d.wk===''?'':'WK'+esc(d.wk)}</td><td class="mono">${esc(d.asin)}</td><td class="mono">${esc(d.mcid)}</td><td>${ch(d.pvs,'PVS')}${ch(d.sim,'SIM')}${ch(d.pl||(/^\d{6,}$/.test(d.cid)&&C_URL+d.cid),'Paragon Case')}</td></tr>`).join('')}</table>${U.fresh.length>6?`<p class="hint" style="margin:0">…and ${U.fresh.length-6} more</p>`:''}`:''}
    <div class="btns">${U.fresh.length?`<button class="pri" data-act="ok">Add ${U.fresh.length} tickets</button>`:''}<button data-act="no">${U.fresh.length?'Cancel':'Choose another file'}</button></div>`
  :`<label class="drop" for="file"><b>Choose an Excel or CSV file</b><span>or drop it here</span></label><input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    <p class="hint">Needs an <b>ASIN</b> column. Also read when present: WK or Creation WK, Creation Date, MCID, PVS, SIM, Paragon Case Link, Paragon Case ID, Investigator, FC, Adhoc (Y/N). Long links show as short PVS, SIM and Paragon Case links.</p>`;
  $('#view').innerHTML=`<div class="grid2" style="margin-top:0">
   <section class="card"><h3>Upload tickets</h3>${box}</section>
   <section class="card"><h3>SIMs with no update yet</h3><p style="margin-top:0"><b>${P.length}</b> case${P.length===1?'':'s'} still have no update (no status/defect) or are Pending FC.</p>${hb(bw,P.length,'var(--open)')}
    ${dl?`<div class="btns"><button class="pri" data-act="pend"${P.length?'':' disabled'}>Download as Excel</button></div>`:''}</section></div>
   <section class="card" style="margin-top:14px"><h3>Recent uploads</h3>${imps.length?`<ul class="log">${imps.map(x=>`<li><span class="av">${esc(ini(x.by))}</span><div><b>${esc(x.by)}</b> added ${esc(x.n)}</div><time>${f(x.at)}</time></li>`).join('')}</ul>`:'<span class="mut">No uploads yet.</span>'}</section>`;
}
$('#imp').onclick=()=>{setTab('u');try{history.replaceState(null,'','#/upload')}catch(x){}};
$('#pend').onclick=exportPending;
$('#norev').onclick=exportNoReversal;
$('#exp').onclick=async()=>{
  const out=rows.map(r=>({WK:r.wk,'Creation Date':r.cd,ASIN:r.asin,MCID:r.mcid,PVS:r.pvs,SIM:r.sim,'Paragon Case Link':r.pl||(/^\d{6,}$/.test(r.cid)?C_URL+r.cid:''),'Paragon Case ID':r.cid,Investigator:r.raw.inv,Statues:r.raw.st,'Defect type':r.raw.df,'Investigation Date':r.raw.idt,FC:r.raw.fc,'Adhoc (Y/N)':r.raw.ad,Reversed:r.raw.rv,Notes:r.raw.nt}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(out),'Cases');await save2(wb,`CCR_BC_FBA_EG_${today()}.xlsx`);
};
V.addEventListener('dragover',e=>{if(e.target.closest('.drop'))e.preventDefault()});
V.addEventListener('drop',e=>{if(e.target.closest('.drop')){e.preventDefault();readFile(e.dataTransfer.files[0])}});
async function exportFiltered(){
  const L=filt();if(!L.length)return toast('No rows match the current filters');
  const out=L.map(r=>({WK:r.wk,'Creation Date':r.cd,ASIN:r.asin,MCID:r.mcid,PVS:r.pvs,SIM:r.sim,'Paragon Case Link':r.pl||(/^\d{6,}$/.test(r.cid)?C_URL+r.cid:''),'Paragon Case ID':r.cid,Investigator:r.raw.inv,Statues:r.raw.st,'Defect type':r.raw.df,'Investigation Date':r.raw.idt,'Days open':age(r),FC:r.raw.fc,'Adhoc (Y/N)':r.raw.ad,Reversed:r.raw.rv,Notes:r.raw.nt}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(out),'Filtered');await save2(wb,`CCR_filtered_${today()}.xlsx`);
}
/* ---------- boot ---------- */
loadLocal();
(function(){const t=ls('caseflow_theme')||'light';document.documentElement.setAttribute('data-theme',t);
  const b=$('#themebtn');if(b)b.onclick=()=>{const n=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',n);ls('caseflow_theme',n)};})();
build();setSync(false);setTab(R[(location.hash||'').slice(2)]||'q');
(async()=>{
  try{dl=await window.claude?.use('downloads')||null}catch(e){}
  try{
    const d=await window.claude?.use('db');if(!d)return;db=d;setSync(true);
    db.collection('cases').onSnapshot(s=>{ov={};s.docs.forEach(x=>ov[x.id]=x.data());build();refresh()},()=>{db=null;setSync(false)});
    db.collection('log').orderBy('at','desc').limit(200).onSnapshot(s=>{log=s.docs.map(x=>x.data());if(tab!=='q')refresh()},()=>{});
  }catch(e){setSync(false)}
})();
</script>
